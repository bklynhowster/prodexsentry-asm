name: Daily posture digest

# 318 (2026-10-14) — Prodex gets the same daily digest Command has had.
# Howie, after reading the Command one: "I love the digest. It's just great.
# Do we have something similar for prodex?" — it did not: the code was here,
# byte-identical to Command's, but this job file never was.
#
# Runs once a day at 12:00 UTC = 07:00 ET (08:00 ET during EDT). Cron is UTC.
# Also runnable manually from the Actions tab via workflow_dispatch;
# dry_run=true is safe (renders, no email, no DB write).
#
# Mail transport (4.7 M1): Prodex sends over SMTP/iCloud — the same settings
# the mail canary (11:00 UTC) and discovery already use on this repo.
#
# ⚠ IDENTITY COMES FROM REPO VARIABLES, NOT FROM THIS FILE. Command's copy of
# this job carries `|| 'literal'` fallbacks because those literals ARE
# Command's identity; its own comment says to delete them when mirrored.
# They are deleted here. run_alerter.py has no defaults either (4.7 M5), so
# an unset variable makes the job stop with a clear message rather than send
# Prodex's posture as, or to, the wrong tenant. The variables this job reads:
#   ALERTER_FROM, ALERTER_FROM_NAME   (already set — the canary uses them)
#   ALERTER_TO                        howie, sean, keanu @prodexlabs.com
#   ALERTER_PORTAL_URL                https://prodexsentry.netlify.app
#   ALERTER_DASHBOARD_URL             the Prodex Supabase project

#
# KB 12 job 3l slice 2 (2026-10-22) — THE MONDAY WEEKLY rides in this same job, so
# its identity is the daily's (one block of variables; the 318 pins cover both).
# Howie, 14:59: "the weekly should definitely be Monday. If it's not Monday, it's
# Friday, and frankly, on Friday, nobody pays attention." Its cron fires five
# minutes after the daily's, so Monday brings the daily list and then the week.
#
# AND A TEST SEND (Howie, 16:54: "generate a daily and a weekly to send to me and
# the other recipients"): run by hand with preview=true. It sends the last 24
# hours (or, with kind=weekly, the last seven days) right away and WRITES NOTHING,
# so the next scheduled digest covers exactly what it would have. preview_to may
# narrow the recipients to some of ALERTER_TO; run_alerter.py refuses any address
# that is not already on it.

on:
  schedule:
    - cron: "0 12 * * *"     # the daily list
    - cron: "5 12 * * 1"     # the Monday weekly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but don't send / write"
        required: false
        default: "false"
      kind:
        description: "daily or weekly"
        required: false
        default: "daily"
      preview:
        description: "Test send: send now, record nothing (true/false)"
        required: false
        default: "false"
      preview_to:
        description: "Test send only: some of ALERTER_TO, comma-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 316: PyYAML — the block-page library (312) reads artifact_signatures.yaml.
          # Its absence crashed the Command digest of 2026-10-14 on the first measured block.
          pip install 'psycopg[binary]==3.3.4' 'pyyaml>=6,<7'

      - name: Run alerter
        env:
          SUPABASE_DSN:        ${{ secrets.SUPABASE_DSN }}
          # Transport. Prodex: smtp/iCloud (MAIL_PROVIDER=smtp). The SendGrid key
          # is passed through for parity with Command's job; unused here.
          SENDGRID_API_KEY:    ${{ secrets.SENDGRID_API_KEY }}
          MAIL_PROVIDER:       ${{ vars.MAIL_PROVIDER }}
          SMTP_HOST:           ${{ vars.SMTP_HOST }}
          SMTP_PORT:           ${{ vars.SMTP_PORT }}
          SMTP_USER:           ${{ vars.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          INSTANCE_NAME:       ${{ github.event.repository.name }}
          # Which digest, and whether it is a test send. Read as variables, never
          # pasted into the script: a typed input cannot become a shell command.
          EVENT_NAME:          ${{ github.event_name }}
          EVENT_SCHEDULE:      ${{ github.event.schedule }}
          IN_DRY_RUN:          ${{ github.event.inputs.dry_run }}
          IN_KIND:             ${{ github.event.inputs.kind }}
          IN_PREVIEW:          ${{ github.event.inputs.preview }}
          ALERTER_PREVIEW_TO:  ${{ github.event.inputs.preview_to }}
          # Identity — repo variables only, no fallbacks (see the header).
          ALERTER_FROM:          ${{ vars.ALERTER_FROM }}
          ALERTER_FROM_NAME:     ${{ vars.ALERTER_FROM_NAME }}
          ALERTER_TO:            ${{ vars.ALERTER_TO }}
          ALERTER_DASHBOARD_URL: ${{ vars.ALERTER_DASHBOARD_URL }}
          # Note 307 — links in the email go to the portal, not the raw database.
          ALERTER_PORTAL_URL:    ${{ vars.ALERTER_PORTAL_URL }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "5 12 * * 1" ]; then args+=(--weekly); fi
          else
            if [ "$IN_KIND" = "weekly" ]; then args+=(--weekly); fi
            if [ "$IN_PREVIEW" = "true" ]; then args+=(--preview); fi
            if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          fi
          echo "run_alerter.py ${args[*]}"
          python scripts/alerter/run_alerter.py "${args[@]}"
